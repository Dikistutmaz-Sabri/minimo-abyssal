<!doctype html>

     Needs Chrome's --allow-file-access-from-files: the frame is file:// too, and is driven from here. -->

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03131c;cursor:none}

</style></head><body>
<iframe id=f></iframe><div id=veil></div>
<script src="wallpaper.js"></script>
